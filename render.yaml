services:
  - type: web
    name: campusai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: PROJECT_NAME
        value: CampusAI
      - key: API_V1_PREFIX
        value: /api/v1
      - key: ENVIRONMENT
        value: production
      # Set this to your actual Vercel URL after the frontend is deployed —
      # Render env vars can be edited any time without a redeploy of code.
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000"
      # Required for chat/tutor/study-tools/voice/resume/planner to work —
      # set your real key in the Render dashboard, not here.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: OPENAI_CHAT_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_EMBEDDING_MODEL
        value: "text-embedding-3-small"
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: "whisper-1"

databases:
  - name: campusai-db
    plan: free
